name: CI Quality Gate & Test Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test & Gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Core Test Suite (32 tests)
        run: pytest tests/ -v --tb=short

      - name: Run Hand-written Golden Benchmark Tests
        run: |
          export PYTHONPATH=.
          pytest benchmark/golden/ -v --tb=short

      - name: End-to-End Offline Generation Pipeline (Fake Client)
        run: testgen generate --input benchmark/functions/string_ops.py --function slugify --backend fake

      - name: End-to-End Offline Benchmark Run
        run: testgen bench --backend fake --limit 2 --no-charts

      - name: Enforce CI Quality Gate
        run: testgen gate --min-coverage 0.05 --min-mutation-score 0.50
